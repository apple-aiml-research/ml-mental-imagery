repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # the ruff version in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(LICENSE|ACKNOWLEDGEMENTS|assets/fonts/licenses/)
      - id: end-of-file-fixer
        exclude: ^(LICENSE|ACKNOWLEDGEMENTS|assets/fonts/licenses/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
