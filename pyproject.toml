[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "mental-imagery"
version = "0.1.0"
description = "Training vision-language models to reason with visual chain of thought on puzzles"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate==1.13.0",
    "certifi>=2026.10.18",
    "huggingface-hub==1.8.0",
    "hydra-core==1.3.8",
    "numpy>=1.26",
    "omegaconf==2.3.0",
    "openai>=1.60",
    "pillow>=13.0.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "safetensors>=0.5",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==5.6.2",
    "vllm==0.19.1",
]

[project.optional-dependencies]
# Fused CUDA kernels used for training (FlashAttention-2 and the Qwen3.5
# linear-attention layers). flash-attn and causal-conv1d compile from source
# against the pinned torch: `uv sync --extra kernels` (needs the CUDA toolkit).
kernels = [
    "causal-conv1d==1.6.1",
    "flash-attn==2.8.3",
    "flash-linear-attention==0.5.2",
]

[dependency-groups]
dev = [
    "maturin>=1.12,<2.0",
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.maturin]
module-name = "mental_imagery.engine"
features = ["python"]

[tool.uv]
# Rebuild the Rust extension whenever the engine sources or its embedded fonts change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "build.rs" },
    { file = "engine/**/*.rs" },
    { file = "assets/fonts/*.ttf" },
]

[tool.uv.extra-build-dependencies]
# Compile the kernels against the torch version installed in the environment.
causal-conv1d = [{ requirement = "torch", match-runtime = true }]
flash-attn = [{ requirement = "torch", match-runtime = true }]

# Static metadata so `uv lock` does not have to build these source
# distributions (both need torch at build time).
[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["einops", "torch"]

[[tool.uv.dependency-metadata]]
name = "causal-conv1d"
version = "1.6.1"
requires-dist = ["ninja", "packaging", "torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
ignore = ["E501"]
