# @package _global_
# Qwen3.5-0.8B: Visual CoT, 64x64 boards (4x4 LlamaGen tokens per board).
defaults:
  - override /model: qwen3_5_0_8b
  - override /method: visual_cot

run_name: qwen3_5_0_8b/visual_cot_64

visual_tokens:
  grid_size: 4
  loss_weight: 0.05

training:
  per_gpu_batch_size: 16
  gradient_accumulation_steps: 4
  total_steps: 50000

optimizer:
  lr: 3.0e-5

scheduler:
  warmup_steps: 250

fsdp:
  activation_checkpointing: false

checkpoint:
  save_every_steps: 4000
