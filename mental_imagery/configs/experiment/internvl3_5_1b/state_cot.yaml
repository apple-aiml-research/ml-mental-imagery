# @package _global_
# InternVL3.5 1B: State CoT (JSON state descriptions between <board> and </board>).
defaults:
  - override /model: internvl3_5_1b
  - override /method: state_cot

run_name: internvl3_5_1b/state_cot

text_cot:
  loss_weight: 0.3

training:
  per_gpu_batch_size: 16
  gradient_accumulation_steps: 4
  total_steps: 50000
  max_tokens: 1536

optimizer:
  lr: 3.0e-5

scheduler:
  warmup_steps: 250

fsdp:
  activation_checkpointing: false

checkpoint:
  save_every_steps: 5000
