# @package _global_
# InternVL3.5 1B: Action Supervision (actions only).
defaults:
  - override /model: internvl3_5_1b
  - override /method: action_supervision

run_name: internvl3_5_1b/action_supervision

training:
  per_gpu_batch_size: 32
  gradient_accumulation_steps: 2
  total_steps: 50000

optimizer:
  lr: 1.0e-5

scheduler:
  warmup_steps: 500

fsdp:
  activation_checkpointing: false

checkpoint:
  save_every_steps: 5000
