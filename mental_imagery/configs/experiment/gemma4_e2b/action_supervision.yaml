# @package _global_
# Gemma 4 E2B: Action Supervision (actions only).
defaults:
  - override /model: gemma4_e2b
  - override /method: action_supervision

run_name: gemma4_e2b/action_supervision

training:
  per_gpu_batch_size: 32
  gradient_accumulation_steps: 2
  total_steps: 25000

optimizer:
  lr: 1.0e-5

scheduler:
  warmup_steps: 500

fsdp:
  activation_checkpointing: true

checkpoint:
  save_every_steps: 4000
