# @package _global_
# Qwen3.5-27B: Action Supervision (actions only).
defaults:
  - override /model: qwen3_5_27b
  - override /method: action_supervision

run_name: qwen3_5_27b/action_supervision

training:
  per_gpu_batch_size: 8
  gradient_accumulation_steps: 8
  total_steps: 100000

optimizer:
  lr: 1.0e-5

scheduler:
  warmup_steps: 125

fsdp:
  reshard_after_forward: true
  activation_checkpointing: true

checkpoint:
  save_every_steps: 4000
