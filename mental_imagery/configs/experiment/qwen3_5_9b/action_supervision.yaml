# @package _global_
# Qwen3.5-9B: Action Supervision (actions only).
defaults:
  - override /model: qwen3_5_9b
  - override /method: action_supervision

run_name: qwen3_5_9b/action_supervision

training:
  per_gpu_batch_size: 32
  gradient_accumulation_steps: 2
  total_steps: 50000

optimizer:
  lr: 1.0e-5

scheduler:
  warmup_steps: 500

fsdp:
  activation_checkpointing: true

checkpoint:
  save_every_steps: 5000
